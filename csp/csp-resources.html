<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: same system as the CSP home page; one column of resources grouped by semester */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14212b; --muted:#56656f; --line:#d5dee4;
  --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Work Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --fg:#e4ecf2; --muted:#93a4b1; --line:#26343f;
  --accent:#7aa8f0; --accent-soft:#1b2b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --fg:#e4ecf2; --muted:#93a4b1; --line:#26343f;
  --accent:#7aa8f0; --accent-soft:#1b2b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem)}
h2{font-size:1.3rem}
p{margin:0;max-width:65ch}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.back{font-family:var(--mono);font-size:.8rem;text-decoration:none}
header{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sub{color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.item h3{margin:0;font-family:var(--body);font-size:1rem;font-weight:600;line-height:1.3}
.item p.inote{margin:0;font-size:.9rem;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.links li{border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a,.links .nolink{display:grid;grid-template-columns:6.5rem 1fr auto;gap:4px 12px;align-items:baseline;padding:9px 2px;text-decoration:none;color:var(--fg)}
.links a:hover .label{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.type{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.label{font-weight:500;min-width:0}
.fmt{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.nolink .label{color:var(--muted)}
@media (max-width:460px){.links a,.links .nolink{grid-template-columns:1fr auto}.links .type{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="csp-home.html">← CSP home</a>
    <h1>Resources</h1>
    <p class="sub">Everything we've used in class, in one place. Links open in a new tab.</p>
  </header>
  <div id="list"></div>
</div>

<script>
/* ===== ADD RESOURCES HERE =====
   Each item is one box on the page. Put related files (slides, notes, games) in the same item.
   section: heading the item goes under (sections appear in the order they first show up)
   title:   name of the box
   note:    optional line under the title
   links:   the files in this box, in the order shown. Put slides first.
     type:  short tag, e.g. Slides, Notes, Reading, Interactive, Game, Cards, Rubric, Guide, Reference
     label: optional text for the link (defaults to the item title)
     url:   full link. For files in the class-games repo use
            https://rebeccacrane.github.io/class-games/csp/FILENAME  (spaces become %20, & becomes %26)
            Leave it "" and the link shows as "coming soon".
     fmt:   optional format note, e.g. PDF
*/
const U0 = "Unit 0 · Introduction to Computer Science";
const U3 = "Unit 3 · Intro to CMU Graphics";
const RESOURCES = [
  { section: "All year", title: "CSP quick reference", links: [
    { type: "Reference", url: "https://rebeccacrane.github.io/class-games/csp/CSP_Quick_Reference.pdf", fmt: "PDF" },
  ]},

  { section: U0, title: "Week 2a: What Is Computer Science?", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_2a_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_2a_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U0, title: "Week 2b: How Computers Work", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_2b_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_2b_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U0, title: "Week 3: The Computing Stack", note: "All three are the same lesson. Pick the version you need.", links: [
    { type: "Reading",     label: "The reading only", url: "https://rebeccacrane.github.io/class-games/csp/Week_3_TheComputingStack.pdf", fmt: "PDF" },
    { type: "Interactive", label: "The reading online, plus the review game", url: "https://rebeccacrane.github.io/class-games/csp/TheComputingStack.html" },
    { type: "Game",        label: "The review game only", url: "https://rebeccacrane.github.io/class-games/csp/unit0-review-game.html" },
  ]},
  { section: U0, title: "Programming language sort", links: [
    { type: "Cards", label: "Language and job cards", url: "https://rebeccacrane.github.io/class-games/csp/language-sort-cards.pdf", fmt: "PDF" },
  ]},

  { section: U3, title: "Creative Task 1", links: [
    { type: "Rubric", label: "Rubric", url: "https://rebeccacrane.github.io/class-games/csp/creative-task-1-rubric.html" },
    { type: "Guide",  label: "Design & Development Guide", url: "https://rebeccacrane.github.io/class-games/csp/Design%26DevelopmentGuide.pdf", fmt: "PDF" },
  ]},
];
/* ===== END OF LIST ===== */

const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const groups = new Map();
RESOURCES.forEach(r => { if (!groups.has(r.section)) groups.set(r.section, []); groups.get(r.section).push(r); });
let html = "";
groups.forEach((items, name) => {
  html += `<section><h2>${esc(name)}</h2><div class="items">`;
  items.forEach(it => {
    html += `<div class="item"><h3>${esc(it.title)}</h3>${it.note ? `<p class="inote">${esc(it.note)}</p>` : ""}<ul class="links">`;
    (it.links || []).forEach(l => {
      const inner = `<span class="type">${esc(l.type)}</span><span class="label">${esc(l.label || it.title)}</span><span class="fmt">${l.url ? esc(l.fmt || "") : "coming soon"}</span>`;
      html += l.url ? `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a></li>` : `<li><div class="nolink">${inner}</div></li>`;
    });
    html += `</ul></div>`;
  });
  html += `</div></section>`;
});
const list = document.getElementById("list");
list.innerHTML = html || `<p class="sub">No resources yet.</p>`;
list.style.display = "flex"; list.style.flexDirection = "column"; list.style.gap = "28px";
</script>
</body>
</html>
