<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: same system as the CSP home page; one column of resources grouped by semester */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14212b; --muted:#56656f; --line:#d5dee4;
  --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Work Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --fg:#e4ecf2; --muted:#93a4b1; --line:#26343f;
  --accent:#7aa8f0; --accent-soft:#1b2b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --fg:#e4ecf2; --muted:#93a4b1; --line:#26343f;
  --accent:#7aa8f0; --accent-soft:#1b2b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem)}
h2{font-size:1.3rem}
p{margin:0;max-width:65ch}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.back{font-family:var(--mono);font-size:.8rem;text-decoration:none}
header{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sub{color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.item h3{margin:0;font-family:var(--body);font-size:1rem;font-weight:600;line-height:1.3}
.item p.inote{margin:0;font-size:.9rem;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.links li{border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a,.links .nolink{display:grid;grid-template-columns:6.5rem 1fr auto;gap:4px 12px;align-items:baseline;padding:9px 2px;text-decoration:none;color:var(--fg)}
.links a:hover .label{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.type{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.label{font-weight:500;min-width:0}
.fmt{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.nolink .label{color:var(--muted)}
@media (max-width:460px){.links a,.links .nolink{grid-template-columns:1fr auto}.links .type{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="csp-home.html">← CSP home</a>
    <h1>Resources</h1>
    <p class="sub">Handouts, notes, and review games from class. Code.org and CMU CS Academy materials are on those sites. Links open in a new tab.</p>
  </header>
  <div id="list"></div>
</div>

<script>
/* ===== ADD RESOURCES HERE =====
   Each item is one box on the page. Put related files (slides, notes, games) in the same item.
   section: heading the item goes under (sections appear in the order they first show up)
   title:   name of the box
   note:    optional line under the title
   links:   the files in this box, in the order shown. Put slides first.
     type:  short tag, e.g. Slides, Notes, Reading, Interactive, Game, Cards, Rubric, Guide, Reference
     label: optional text for the link (defaults to the item title)
     url:   full link. For files in the class-games repo use
            https://rebeccacrane.github.io/class-games/csp/FILENAME  (spaces become %20, & becomes %26)
            Leave it "" and the link shows as "coming soon".
     fmt:   optional format note, e.g. PDF
*/
const U0 = "Unit 0 · Introduction to Computer Science";
const U1 = "Unit 1 · Digital Information";
const U2 = "Unit 2 · The Internet";
const U3 = "Unit 3 · Intro to CMU Graphics";
const U4 = "Unit 4 · Functions, Mouse Events, Conditionals";
const RESOURCES = [
  { section: "All year", title: "CSP quick reference", links: [
    { type: "Reference", url: "https://rebeccacrane.github.io/class-games/csp/CSP_Quick_Reference.pdf", fmt: "PDF" },
  ]},

  { section: U0, title: "Week 2a: What Is Computer Science?", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_2a_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_2a_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U0, title: "Week 2b: How Computers Work", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_2b_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_2b_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U0, title: "Week 3: The Computing Stack", note: "All three are the same lesson. Pick the version you need.", links: [
    { type: "Reading",     label: "The reading only", url: "https://rebeccacrane.github.io/class-games/csp/Week_3_TheComputingStack.pdf", fmt: "PDF" },
    { type: "Interactive", label: "The reading online, plus the review game", url: "https://rebeccacrane.github.io/class-games/csp/TheComputingStack.html" },
    { type: "Game",        label: "The review game only", url: "https://rebeccacrane.github.io/class-games/csp/unit0-review-game.html" },
  ]},
  { section: U0, title: "Programming language sort", links: [
    { type: "Cards", label: "Language and job cards", url: "https://rebeccacrane.github.io/class-games/csp/language-sort-cards.pdf", fmt: "PDF" },
    // { type: "Key",   label: "Answer key", url: "https://rebeccacrane.github.io/class-games/csp/language-sort-answers.html" },
  ]},

  { section: U1, title: "Unit 1 notebook templates", note: "Code.org Unit Journal pages. Each page says which lesson it goes with.", links: [
    { type: "Notes", label: "Unit 1 notebook templates", url: "https://rebeccacrane.github.io/class-games/csp/Unit1Notebook.pdf", fmt: "PDF" },
  ]},
  { section: U1, title: "Lesson 4: Binary Numbers", links: [
    { type: "Input",    label: "Binary Numbers lesson input", url: "https://rebeccacrane.github.io/class-games/csp/L4Input%E2%80%94BinaryNumbers.pdf", fmt: "PDF" },
  ]},
  { section: U1, title: "Lessons 5–8: Digital Information Challenge", note: "Overflow and rounding, text, black and white images, color images.", links: [
    { type: "Activity",    label: "Case files 1–4", url: "https://rebeccacrane.github.io/class-games/csp/L5-8Activity%E2%80%94CaseFiles.pdf", fmt: "PDF" },
    { type: "Key",         label: "Case files 1–4 answer key", url: "https://rebeccacrane.github.io/class-games/csp/L5-8Activity%E2%80%94CaseFilesKey.pdf", fmt: "PDF" },
    { type: "Activity",    label: "Bonus case", url: "https://rebeccacrane.github.io/class-games/csp/L5-8Activity%E2%80%94BonusCase.pdf", fmt: "PDF" },
    { type: "Key",         label: "Bonus case answer key", url: "https://rebeccacrane.github.io/class-games/csp/L5-8Activity%E2%80%94BonusCaseKey.pdf", fmt: "PDF" },
    { type: "Exit ticket", label: "Exit ticket", url: "https://rebeccacrane.github.io/class-games/csp/L5-8Activity%E2%80%94ExitTicket.pdf", fmt: "PDF" },
  ]},
  { section: U1, title: "Lesson 12: Intellectual Property", note: "Case studies: tattoo copyrights in video games, DNA as data, and digital actors, with what has happened since.", links: [
    { type: "Slides", label: "Computing innovations case studies", url: "https://rebeccacrane.github.io/class-games/csp/computing-innovations-case-studies.html" },
  ]},

  { section: U2, title: "Unit 2 notebook templates", note: "Code.org Unit Journal pages. Each page says which lesson it goes with.", links: [
    { type: "Notes", label: "Unit 2 notebook templates", url: "https://rebeccacrane.github.io/class-games/csp/Unit2Notebook.pdf", fmt: "PDF" },
  ]},
  { section: U2, title: "Lesson 2: Building a Network", note: "Do this instead of the Lesson 2 video. Paste your answers into the Teams assignment when you finish.", links: [
    { type: "Interactive", label: "Network Builder", url: "https://rebeccacrane.github.io/class-games/csp/network-builder.html" },
    { type: "Exit ticket", label: "Exit check (in class)", url: "https://rebeccacrane.github.io/class-games/csp/network-exit-check.html" },
  ]},
  { section: U2, title: "Lesson 3: The Need for Addressing", note: "Play all four weeks, then take a screenshot of your answers or copy them into a document and attach it to the Teams assignment.", links: [
    { type: "Interactive", label: "Addressing Challenge", url: "https://rebeccacrane.github.io/class-games/csp/addressing-challenge.html" },
  ]},
  { section: U2, title: "Lesson 4: Routers and Redundancy", note: "Run traceroute on your own computer. Attach your 4 screenshots and your answers to the Teams assignment.", links: [
    { type: "Activity", label: "Trace the Internet", url: "https://rebeccacrane.github.io/class-games/csp/trace-the-internet.html" },
  ]},
  { section: U2, title: "Lesson 5: Packets", note: "Finish all 3 levels, then turn in your answers on Teams.", links: [
    { type: "Interactive", label: "Packet Puzzle", url: "https://rebeccacrane.github.io/class-games/csp/packet-puzzle.html" },
  ]},
  { section: U2, title: "Lesson 6: HTTP and DNS", note: "Use nslookup and your browser's developer tools. Turn in your 4 screenshots and your answers on Teams.", links: [
    { type: "Activity", label: "Behind the Address Bar", url: "https://rebeccacrane.github.io/class-games/csp/behind-the-address-bar.html" },
  ]},

  { section: U3, title: "Creative Task 1", links: [
    { type: "Rubric", label: "Rubric", url: "https://rebeccacrane.github.io/class-games/csp/creative-task-1-rubric.html" },
    { type: "Guide",  label: "Design & Development Guide", url: "https://rebeccacrane.github.io/class-games/csp/Design%26DevelopmentGuide.pdf", fmt: "PDF" },
  ]},
  { section: U3, title: "Exam 1 review", note: "Covers Unit 3 (CMU Unit 1), programming languages, and how computers work.", links: [
    { type: "Game", label: "Exam 1 review Jeopardy", url: "https://rebeccacrane.github.io/class-games/csp/CSPJeopardy.html" },
  ]},
  { section: U3, title: "Unit 3 Refresher: Drawing with Code", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Unit3_Refresher_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Unit3_Refresher_GuidedNotes.pdf", fmt: "PDF" },
  ]},

  { section: U4, title: "Week 9: Writing Functions", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_9_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_9_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U4, title: "Week 10: Multiple Parameters", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_10_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_10_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U4, title: "Week 11: Variables and Mouse Events", links: [
    { type: "Slides", label: "Lesson slides", url: "https://rebeccacrane.github.io/class-games/csp/Week_11_Slides.pdf", fmt: "PDF" },
    { type: "Notes",  label: "Guided notes", url: "https://rebeccacrane.github.io/class-games/csp/Week_11_GuidedNotes.pdf", fmt: "PDF" },
  ]},
  { section: U4, title: "Creative Task 2", note: "Everyone uses the main rubric. Students taking the AP exam use the AP exam version, which adds a video and code screenshots.", links: [
    { type: "Rubric", label: "Rubric", url: "https://rebeccacrane.github.io/class-games/csp/creative-task-2-rubric.html" },
    { type: "Rubric", label: "Rubric: AP exam version (AP exam students only)", url: "https://rebeccacrane.github.io/class-games/csp/creative-task-2-ap-rubric.html" },
    { type: "Guide",  label: "Design & Development Guide", url: "https://rebeccacrane.github.io/class-games/csp/CreativeTask2_DesignGuide.pdf", fmt: "PDF" },
  ]},

  /* ===== BLOWN TO BITS READINGS (commented out until needed) =====
     To turn a unit on: move its U5/U8/U10 line up next to the other unit names (above RESOURCES),
     then move that unit's items out of this comment. #page= is the printed page + 19.

  const U5  = "Unit 5 · Data";
  const U8  = "Unit 8 · Cybersecurity and Global Impacts";
  const U10 = "Unit 10 · Algorithms";

  { section: "All year", title: "Blown to Bits (2nd edition)", note: "Free under a Creative Commons license. Reading links below open the book at the right page.", links: [
    { type: "Reading", label: "Full book", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf", fmt: "PDF" },
  ]},

  { section: U5, title: "Lesson 1: Learning from Data", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 4: Search Gatekeepers (pp. 94–103)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=113", fmt: "PDF" },
  ]},
  { section: U5, title: "Lesson 5: Big, Open, and Crowdsourced Data", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 3: What Kind of Vegetable Are You? and Footprints and Fingerprints (pp. 51–63)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=70", fmt: "PDF" },
  ]},
  { section: U5, title: "Lesson 6: Machine Learning and Bias", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 9: AI, machine learning, and algorithmic decisions (pp. 267–276)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=286", fmt: "PDF" },
  ]},
  { section: U5, title: "Tell a Data Story project", note: "Optional reading.", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 9: Thrown Under a Jaywalking Bus (p. 266)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=285", fmt: "PDF" },
  ]},

  { section: U8, title: "Lesson 1: Innovation Simulation Part 1", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 1: Good and Ill, Promise and Peril (pp. 17–19)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=36", fmt: "PDF" },
  ]},
  { section: U8, title: "Lesson 2: Data Policies and Privacy", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 3: Fair Information Practice Principles and Always On (pp. 64–71)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=83", fmt: "PDF" },
  ]},
  { section: U8, title: "Lesson 3: The Value of Privacy", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 2: 1984 Is Here and Location, Location, Location (pp. 21–31)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=40", fmt: "PDF" },
  ]},
  { section: U8, title: "Lesson 6: Security Risks Part 2", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 2: The Internet of Things (pp. 42–47)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=61", fmt: "PDF" },
  ]},
  { section: U8, title: "Lesson 8: Protecting Data Part 1", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 5: Historical Cryptography and Lessons for the Internet Age (pp. 122–135)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=141", fmt: "PDF" },
  ]},
  { section: U8, title: "Protecting Data: public keys, passwords, and multifactor authentication", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 5: Secrecy Changes Forever (pp. 135–147)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=154", fmt: "PDF" },
  ]},
  { section: U8, title: "Innovation Simulation: final parts", note: "Optional reading for stakeholder arguments.", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 2: Big Brother, Abroad and in the United States (pp. 32–41)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=51", fmt: "PDF" },
  ]},

  { section: U10, title: "Lesson 3: Unreasonable Time", links: [
    { type: "Reading", label: "Blown to Bits, Ch. 5: Secrecy Changes Forever (pp. 135–147)", url: "https://rebeccacrane.github.io/class-games/csp/BlownToBits_2e.pdf#page=154", fmt: "PDF" },
  ]},
  { section: U10, title: "Lesson 4: The Limits of Algorithms", links: [
    { type: "Reading", label: "Mobile CSP 5.9: Limits of Algorithms", url: "https://runestone.academy/ns/books/published/mobilecsp/Unit5-Algorithms-Procedural-Abstraction/Limits-of-Algorithms.html" },
  ]},
  ===== END OF BLOWN TO BITS READINGS ===== */
];
/* ===== END OF LIST ===== */

const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const groups = new Map();
RESOURCES.forEach(r => { if (!groups.has(r.section)) groups.set(r.section, []); groups.get(r.section).push(r); });
let html = "";
groups.forEach((items, name) => {
  html += `<section><h2>${esc(name)}</h2><div class="items">`;
  items.forEach(it => {
    html += `<div class="item"><h3>${esc(it.title)}</h3>${it.note ? `<p class="inote">${esc(it.note)}</p>` : ""}<ul class="links">`;
    (it.links || []).forEach(l => {
      const inner = `<span class="type">${esc(l.type)}</span><span class="label">${esc(l.label || it.title)}</span><span class="fmt">${l.url ? esc(l.fmt || "") : "coming soon"}</span>`;
      html += l.url ? `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a></li>` : `<li><div class="nolink">${inner}</div></li>`;
    });
    html += `</ul></div>`;
  });
  html += `</div></section>`;
});
const list = document.getElementById("list");
list.innerHTML = html || `<p class="sub">No resources yet.</p>`;
list.style.display = "flex"; list.style.flexDirection = "column"; list.style.gap = "28px";
</script>
</body>
</html>
