<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formal Logic Pixel Art: A, E, I or O?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EDF1; --card:#FFFFFF; --ink:#1D2833; --muted:#566473; --line:#C6D0DA;
  --brass:#8E621A; --brass-soft:#F2E4C8;
  --good:#2B7453; --good-soft:#DAEEE3;
  --bad:#AD3F37; --bad-soft:#F6DDDA;
  --sel:#2C5A87; --sel-soft:#D9E5F1;
  --cell:#D5DDE4; --cell-line:#C3CDD6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181F; --card:#1B242E; --ink:#E3E8ED; --muted:#9BA9B7; --line:#34424F;
    --brass:#D8A64F; --brass-soft:#3A2F1B;
    --good:#5DC190; --good-soft:#1B3A2B;
    --bad:#E27D74; --bad-soft:#442321;
    --sel:#86B5E3; --sel-soft:#1E3348;
    --cell:#26313C; --cell-line:#303D4A;
  }
}
:root[data-theme="dark"]{
  --bg:#12181F; --card:#1B242E; --ink:#E3E8ED; --muted:#9BA9B7; --line:#34424F;
  --brass:#D8A64F; --brass-soft:#3A2F1B;
  --good:#5DC190; --good-soft:#1B3A2B;
  --bad:#E27D74; --bad-soft:#442321;
  --sel:#86B5E3; --sel-soft:#1E3348;
  --cell:#26313C; --cell-line:#303D4A;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.05rem;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:Alegreya,Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

header.top{padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
header.top h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.01em}
header.top p{margin:6px 0 0;color:var(--muted);max-width:62ch}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:24px;align-items:start}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.q.done{border-color:var(--good);background:var(--good-soft)}
.q .stmt{font-family:Alegreya,Georgia,serif;font-size:1.2rem;font-weight:700;line-height:1.3;white-space:pre-line}
.q .num{color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:.95rem;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:52px;padding:8px 14px;border-radius:9px;border:2px solid var(--brass);background:var(--brass-soft);font-weight:700;cursor:pointer}
.opt:hover:not(:disabled){filter:brightness(.97)}
.opt:disabled{cursor:default;opacity:.5}
.opt.right{opacity:1;border-color:var(--good);background:var(--good);color:var(--card)}
.opt.wrong{opacity:1;border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.textans{display:flex;gap:8px;flex-wrap:wrap}
.textans input{flex:1;min-width:140px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.textans button{padding:8px 16px;border-radius:9px;border:2px solid var(--brass);background:var(--brass-soft);font-weight:700;cursor:pointer}
.fb{font-size:.95rem;min-height:0}
.fb:empty{display:none}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad);font-weight:700}
.fb strong{color:var(--good)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .px.on{transition:background-color .5s ease}
}

.side{position:sticky;top:16px;display:grid;gap:12px}
.frame{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px}
.board{display:grid;aspect-ratio:1/1;width:100%;gap:1px;background:var(--cell-line);border:1px solid var(--cell-line)}
.px{background:var(--cell)}
.progress{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-weight:700}
.progress .count{font-family:Alegreya,Georgia,serif;font-size:1.5rem}
.bar{height:8px;border-radius:99px;background:var(--cell);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;width:0;background:var(--good);transition:width .4s}

.primary{display:inline-block;padding:12px 20px;border-radius:10px;border:none;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;font-size:1.05rem}
.primary:hover{filter:brightness(1.15)}
.hidden{display:none !important}

.finish{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:26px;max-width:640px;margin-top:24px}
.finish h2{font-size:2rem;margin-bottom:8px}
.finish label{display:block;font-weight:700;margin:16px 0 6px}
.finish input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.scorebox{margin:18px 0;padding:16px;border-radius:10px;background:var(--brass-soft);border:1.5px solid var(--brass);display:flex;gap:16px;align-items:center}
.scorebox canvas{width:96px;height:96px;image-rendering:pixelated;border-radius:6px;flex:none}
.scorebox .big{font-family:Alegreya,Georgia,serif;font-size:2.6rem;font-weight:800;line-height:1}
.scorebox .who{font-weight:700;font-size:1.2rem;min-height:1.4em}
.scorebox p{margin:6px 0 0}
.note{color:var(--muted)}

@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .side{order:-1;top:0;z-index:2;background:var(--bg);padding:8px 0}
  .frame{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:10px}
  .progress{margin-top:0}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </header>

  <div class="layout">
    <ol class="qlist" id="qlist"></ol>
    <aside class="side">
      <div class="frame">
        <div class="board" id="board" aria-label="Mystery picture"></div>
        <div>
          <div class="progress"><span>Picture revealed</span><span class="count" id="count"></span></div>
          <div class="bar"><span id="bar"></span></div>
        </div>
      </div>
    </aside>
  </div>

  <section id="finish" class="finish hidden">
    <h2>Picture complete!</h2>
    <p class="note">Type your name, then take a screenshot of this box and post it in the Teams assignment.</p>
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="First and last name">
    <div class="scorebox">
      <canvas id="thumb" width="16" height="16"></canvas>
      <div>
        <div class="who" id="who"></div>
        <div class="big" id="total"></div>
        <p id="breakdown"></p>
        <p class="note" id="when"></p>
      </div>
    </div>
    <button class="primary" id="again">Play again</button>
  </section>
</main>

<script>
/* ===================== GAME CONTENT: EDIT ONLY THIS BLOCK =====================
   TITLE / SUBTITLE: shown at the top of the page.
   CHOICES: the answer buttons every question uses, e.g. ["A","E","I","O"] or
     ["Valid","Invalid"]. A question can have its own list with  c:[...]  instead.
     Use  CHOICES = []  (or c:[] on one question) to make students TYPE the answer.
   QUESTIONS: one per line.
     x   = the question text (use \n for a line break, e.g. a stacked syllogism)
     a   = the correct answer, spelled exactly like its button. For typed answers,
           give a list of accepted spellings: a:["middle term","the middle term"]
           (typed answers ignore capitals and extra spaces)
     why = one sentence shown after the student gets it right
   PICTURE: paste a picture from picture-maker.html here. Any size grid works.
     Each character in a row is one pixel; the palette says what color it is.
   The picture is split evenly among the questions. Each right answer colors in
   its share. Wrong answers can be retried; the score counts first-try answers.
================================================================================ */
const TITLE = "A, E, I or O?";
const SUBTITLE = "Name the type of each proposition. Every right answer colors in part of the mystery picture. When the picture is done, screenshot your score.";
const CHOICES = ["A","E","I","O"];

const QUESTIONS = [
  {x:"All cats are four-legged creatures.", a:"A", why:"\"All\" makes it universal, and it affirms, so it's A."},
  {x:"No reptiles are warm-blooded animals.", a:"E", why:"\"No\" denies something of every reptile: universal and negative."},
  {x:"Some students are early risers.", a:"I", why:"\"Some\" is particular, and the proposition affirms."},
  {x:"Some planets are not gas giants.", a:"O", why:"\"Some… not\" is particular and negative."},
  {x:"Every triangle is a three-sided figure.", a:"A", why:"\"Every\" works like \"all\": universal and affirmative."},
  {x:"Nobody in the choir is a tuba player.", a:"E", why:"\"Nobody\" denies it of every choir member, so it's universal negative."},
  {x:"Many teenagers are night owls.", a:"I", why:"\"Many are\" doesn't cover every teenager, so it's particular, and it affirms."},
  {x:"Mount Rainier is a volcano.", a:"A", why:"A proposition about a named individual is universal, and this one affirms."},
  {x:"Some movies are not comedies.", a:"O", why:"Particular (\"some\") and negative (\"not\")."},
  {x:"None of the cookies are gluten-free treats.", a:"E", why:"\"None\" denies it of every cookie: universal negative."},
  {x:"Most bridges are not wooden structures.", a:"O", why:"\"Most are not\" is less than all, so it's particular, and it denies."},
  {x:"Anybody who studies is a better test-taker.", a:"A", why:"\"Anybody\" means all who study, and the proposition affirms."},
  {x:"Several dogs at the park are puppies.", a:"I", why:"\"Several\" is particular, and it affirms."},
  {x:"Sherlock Holmes is not a real person.", a:"E", why:"A named individual makes it universal; \"not\" makes it negative."},
  {x:"Some musicians are drummers.", a:"I", why:"Particular and affirmative."},
  {x:"Several of the answers are not correct ones.", a:"O", why:"\"Several are not\" is particular and negative."},
  {x:"No one in the room is a stranger.", a:"E", why:"\"No one\" denies it of everyone in the room: universal negative."},
  {x:"Each player on the team is a runner.", a:"A", why:"\"Each\" covers every player, and it affirms."},
  {x:"Some fruits are not sweet things.", a:"O", why:"Particular (\"some\") and negative (\"not\")."},
  {x:"Some birds are flightless creatures.", a:"I", why:"\"Some\" is particular. \"Flightless\" is part of the predicate term, so the proposition still affirms."}
];

const PICTURE = {
  palette: {".":"#BFE3EA", "k":"#1D2833", "s":"#9AA7B4", "g":"#E2B23C", "y":"#F6DA86", "d":"#B5852A"},
  rows: [
    "................",
    ".....kkkkkk.....",
    "....kssssssk....",
    "...ksskkkkssk...",
    "...ksk....ksk...",
    "...ksk....ksk...",
    "...ksk....ksk...",
    ".kkkkkkkkkkkkkk.",
    ".kyygggggggggdk.",
    ".kyggggkkggggdk.",
    ".kygggkkkkgggdk.",
    ".kgggggkkggggdk.",
    ".kgggggkkggggdk.",
    ".kgggggggggggdk.",
    ".kddddddddddddk.",
    ".kkkkkkkkkkkkkk."
  ]
};
/* ===================== END OF GAME CONTENT ===================== */

const $ = id => document.getElementById(id);
const H = PICTURE.rows.length, W = PICTURE.rows[0].length, N = QUESTIONS.length;

// Seeded shuffle so each question always reveals the same pixels
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(a, seed){ const r=rng(seed); a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g," ");

let cells=[], groups=[], solved=new Set(), firstTry=0, missed=new Set();

function buildBoard(){
  const b=$("board"); b.innerHTML="";
  b.style.gridTemplateColumns="repeat("+W+",1fr)";
  b.style.aspectRatio=W+"/"+H;
  cells=[];
  for(let i=0;i<W*H;i++){ const d=document.createElement("div"); d.className="px"; b.appendChild(d); cells.push(d); }
  const order=seededShuffle([...Array(W*H).keys()], 20261101);
  groups=[...Array(N)].map(()=>[]);
  order.forEach((p,k)=>groups[k%N].push(p));
}

function reveal(qi){
  groups[qi].forEach((p,k)=>{
    const ch=PICTURE.rows[Math.floor(p/W)][p%W];
    setTimeout(()=>{ cells[p].classList.add("on"); cells[p].style.background=PICTURE.palette[ch]||"transparent"; }, k*35);
  });
}

function updateProgress(){
  $("count").textContent=solved.size+" / "+N;
  $("bar").style.width=(solved.size/N*100)+"%";
}

function buildQuestions(){
  const list=$("qlist"); list.innerHTML="";
  QUESTIONS.forEach((q,qi)=>{
    const li=document.createElement("li"); li.className="q";
    const stmt=document.createElement("div"); stmt.className="stmt";
    const num=document.createElement("span"); num.className="num"; num.textContent=(qi+1)+".";
    stmt.append(num, document.createTextNode(q.x));
    const fb=document.createElement("div"); fb.className="fb"; fb.setAttribute("aria-live","polite");
    const choices = q.c || CHOICES;
    let input;
    if(choices.length){
      input=document.createElement("div"); input.className="opts";
      choices.forEach(ch=>{
        const b=document.createElement("button"); b.className="opt"; b.textContent=ch;
        b.onclick=()=>attempt(qi, ch, li, fb, b);
        input.appendChild(b);
      });
    } else {
      input=document.createElement("form"); input.className="textans";
      const t=document.createElement("input"); t.placeholder="Type your answer"; t.setAttribute("aria-label","Answer to question "+(qi+1));
      const go=document.createElement("button"); go.type="submit"; go.textContent="Check";
      input.append(t,go);
      input.onsubmit=e=>{ e.preventDefault(); if(t.value.trim()) attempt(qi, t.value, li, fb, t); };
    }
    li.append(stmt,input,fb); list.appendChild(li);
  });
}

function attempt(qi, given, li, fb, el){
  if(solved.has(qi)) return;
  const q=QUESTIONS[qi];
  const accepted=(Array.isArray(q.a)?q.a:[q.a]).map(norm);
  const right=accepted.includes(norm(given));
  if(right){
    solved.add(qi); if(!missed.has(qi)) firstTry++;
    li.classList.add("done");
    li.querySelectorAll("button,input").forEach(x=>x.disabled=true);
    if(el.tagName==="BUTTON") el.classList.add("right");
    fb.className="fb good"; fb.innerHTML="";
    const s=document.createElement("strong"); s.textContent="Correct. ";
    fb.append(s, document.createTextNode(q.why||""));
    reveal(qi); updateProgress();
    if(solved.size===N) setTimeout(finish, groups[qi].length*35+500);
  } else {
    missed.add(qi);
    if(el.tagName==="BUTTON"){ el.classList.add("wrong"); el.disabled=true; }
    else { el.select(); }
    fb.className="fb bad"; fb.textContent="Not quite. Try again.";
    li.classList.remove("shake"); void li.offsetWidth; li.classList.add("shake");
  }
}

function drawThumb(){
  const c=$("thumb"); c.width=W; c.height=H; const x=c.getContext("2d");
  PICTURE.rows.forEach((row,r)=>[...row].forEach((ch,col)=>{ x.fillStyle=PICTURE.palette[ch]||"rgba(0,0,0,0)"; x.fillRect(col,r,1,1); }));
}

function finish(){
  drawThumb();
  $("finish").classList.remove("hidden");
  $("total").textContent=firstTry+" / "+N;
  $("breakdown").textContent=firstTry+" of "+N+" right on the first try.";
  $("when").textContent="Completed "+new Date().toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
  updateName();
  $("finish").scrollIntoView({behavior:"smooth", block:"center"});
}
function updateName(){ $("who").textContent=$("name").value.trim() || "Type your name above"; }
$("name").addEventListener("input",updateName);

function start(){
  solved=new Set(); missed=new Set(); firstTry=0;
  document.title="Formal Logic Pixel Art: "+TITLE;
  $("title").textContent=TITLE; $("subtitle").textContent=SUBTITLE;
  $("finish").classList.add("hidden");
  buildBoard(); buildQuestions(); updateProgress();
}
$("again").onclick=()=>{ start(); window.scrollTo({top:0}); };
start();
</script>
</body>
</html>
